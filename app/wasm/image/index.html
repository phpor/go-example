<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
   <script src="wasm_exec.js"></script>
   <script>
    async function runGoWasm() {
        const go = new Go();
        const resp = await fetch("main.wasm");
        return await WebAssembly.instantiateStreaming(resp, go.importObject)
            .then((result) => go.run(result.instance));
    }
</script>
</head>
<body onload="runGoWasm()">
    这里演示了JS调用Go函数，以及Go调用JS函数，该页面需要的wasm_exec.js 可以从 $(go env GOROOT)/misc/wasm/wasm_exec.js 获取到
<div id="result"></div>
<button onclick="getUserAgent()">Get User Agent</button>
</body>
</html>
